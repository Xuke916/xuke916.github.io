<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" role="img" aria-labelledby="title"><title id="title">How a hit advances teammates and scores runs</title><defs><marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="9" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L12 5L0 10Z" fill="#183f6c"/></marker></defs><rect width="1200" height="632" fill="#f6f9fd"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="48" fill="#183f6c" font-size="30" text-anchor="start" font-weight="700">How a hit advances teammates and scores runs</text><path d="M635 490L865 330" stroke="#183f6c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M865 280L635 120" stroke="#183f6c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M565 120L335 280" stroke="#183f6c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M335 330L565 490" stroke="#183f6c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="555" y="74" width="90" height="52" fill="#f6f9fd" stroke="#183f6c" stroke-width="2.5"/><text x="600" y="109" fill="#183f6c" font-size="26" text-anchor="middle" font-weight="700">2B</text><rect x="855" y="279" width="90" height="52" fill="#f6f9fd" stroke="#183f6c" stroke-width="2.5"/><text x="900" y="314" fill="#183f6c" font-size="26" text-anchor="middle" font-weight="700">1B</text><rect x="255" y="279" width="90" height="52" fill="#f6f9fd" stroke="#183f6c" stroke-width="2.5"/><text x="300" y="314" fill="#183f6c" font-size="26" text-anchor="middle" font-weight="700">3B</text><rect x="555" y="494" width="90" height="52" fill="#f6f9fd" stroke="#183f6c" stroke-width="2.5"/><text x="600" y="529" fill="#183f6c" font-size="26" text-anchor="middle" font-weight="700">HOME</text><text x="40" y="110" fill="#183f6c" font-size="25" text-anchor="start" font-weight="700">Reaching home</text><text x="40" y="150" fill="#128c78" font-size="23" text-anchor="start">Each runner scores 1 run.</text><text x="600" y="260" fill="#183f6c" font-size="27" text-anchor="middle" font-weight="700">Example: a single</text><text x="600" y="305" fill="#183f6c" font-size="23" text-anchor="middle">The batter reaches first base.</text><text x="600" y="339" fill="#183f6c" font-size="23" text-anchor="middle">Teammates on base each</text><text x="600" y="373" fill="#183f6c" font-size="23" text-anchor="middle">advance one base.</text><text x="600" y="593" fill="#183f6c" font-size="22" text-anchor="middle">3 outs → Switch sides. Both teams bat once per inning; compare scores after 3 innings.</text></g></svg>