<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title"><title id="title">Why normal contact can still result in an out</title><defs><marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="9" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L12 5L0 10Z" fill="#183f6c"/></marker></defs><rect width="1200" height="800" fill="#f6f9fd"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="48" fill="#183f6c" font-size="30" text-anchor="start" font-weight="700">Why normal contact can still result in an out</text><rect x="320" y="88" width="560" height="72" rx="14" fill="none" stroke="#183f6c" stroke-width="2.5"/><text x="600" y="126" fill="#183f6c" font-size="25" text-anchor="middle" font-weight="700">Normal swing makes contact</text><path d="M600 160L600 205" stroke="#183f6c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="320" y="210" width="560" height="72" rx="14" fill="none" stroke="#183f6c" stroke-width="2.5"/><text x="600" y="248" fill="#183f6c" font-size="25" text-anchor="middle" font-weight="700">Determine the batted-ball direction</text><path d="M600 282L600 327" stroke="#183f6c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="320" y="332" width="560" height="108" rx="14" fill="none" stroke="#183f6c" stroke-width="2.5"/><text x="600" y="370" fill="#183f6c" font-size="25" text-anchor="middle" font-weight="700">Relevant fielders roll a six-sided die</text><text x="600" y="405" fill="#183f6c" font-size="25" text-anchor="middle" font-weight="700">Roll ≤ current fielding rating: success</text><path d="M600 440V490H315V545M600 490H900V545" fill="none" stroke="#183f6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M315 490L315 545" stroke="#183f6c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="55" y="552" width="520" height="112" rx="14" fill="none" stroke="#183f6c" stroke-width="2.5"/><text x="315" y="590" fill="#bd3550" font-size="25" text-anchor="middle" font-weight="700">At least one fielder succeeds</text><text x="315" y="625" fill="#bd3550" font-size="25" text-anchor="middle" font-weight="700">Batter is out</text><rect x="625" y="552" width="520" height="112" rx="14" fill="none" stroke="#183f6c" stroke-width="2.5"/><text x="885" y="590" fill="#128c78" font-size="25" text-anchor="middle" font-weight="700">All relevant fielders fail</text><text x="885" y="625" fill="#128c78" font-size="25" text-anchor="middle" font-weight="700">Safe hit; batter reaches base</text><path d="M40 705H1160" stroke="#183f6c" stroke-width="2"/><text x="600" y="758" fill="#183f6c" font-size="25" text-anchor="middle">One-cell contact: automatic home run. The batter scores 1 run.</text></g></svg>